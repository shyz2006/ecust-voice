<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head><body><small>ECUST · 本机登录同步</small><h1>校园笔记，定时带回来 ✨</h1><p>电脑和浏览器开启时运行。遇到登录失效或验证会暂停。</p><label>校园平台同步码<input type="password" id="token" autocomplete="off" placeholder="从校园平台配置中生成，粘贴一次"></label><label>同步间隔<select id="hours"><option value="6">每6小时</option><option value="12">每12小时</option><option value="24">每24小时</option></select></label><button id="connect">连接并开启自动同步</button><div class="actions"><button id="run" hidden>立即同步</button><button id="pause" hidden>暂停自动同步</button></div><p id="autoStatus" role="status"></p><button id="syncCurrent" hidden>同步当前搜索页到平台</button><p id="readDiagnostics" role="status"></p><details><summary>手动导出备用</summary><p>在小红书搜索“华理”，读取当前页的校园笔记。</p><button id="capture">读取当前搜索页</button><a id="download" hidden>下载同步文件</a><p id="status" role="status"></p><ol id="preview"></ol></details><footer>轮换搜索华理、华东理工大学及两个校区，每轮最多30条卡片。账号登录留在本机，校园平台接收标题、可见摘要与原帖链接。</footer></body></html>
