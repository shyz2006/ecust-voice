<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>登录 · BettaFish</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            --bg: #eef3f8;
            --surface: #ffffff;
            --ink: #172033;
            --muted: #687386;
            --line: #dbe3ed;
            --brand: #1768b2;
            --brand-strong: #104d88;
            --danger: #a83f45;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            background:
                radial-gradient(circle at 10% 12%, rgba(23, 104, 178, 0.11), transparent 34%),
                radial-gradient(circle at 88% 88%, rgba(33, 134, 111, 0.08), transparent 30%),
                var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .login-shell {
            width: min(920px, 100%);
            min-height: 520px;
            display: grid;
            grid-template-columns: minmax(300px, 0.9fr) minmax(360px, 1.1fr);
            overflow: hidden;
            border: 1px solid rgba(203, 213, 225, 0.9);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 28px 80px rgba(31, 48, 74, 0.14);
        }

        .login-context {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 42px;
            background: linear-gradient(155deg, #155f9f 0%, #0d3f70 100%);
            color: #fff;
        }

        .login-context::after {
            content: "";
            position: absolute;
            right: -90px;
            bottom: -100px;
            width: 260px;
            height: 260px;
            border: 48px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
        }

        .brand {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.04em;
            backdrop-filter: blur(8px);
        }

        .brand-name {
            font-size: 20px;
            font-weight: 720;
            letter-spacing: -0.01em;
        }

        .context-copy {
            position: relative;
            z-index: 1;
            max-width: 310px;
        }

        .context-copy h2 {
            margin: 0 0 14px;
            font-size: 30px;
            line-height: 1.25;
            letter-spacing: -0.03em;
        }

        .context-copy p {
            margin: 0;
            color: rgba(255, 255, 255, 0.74);
            font-size: 14px;
            line-height: 1.75;
        }

        .context-footnote {
            position: relative;
            z-index: 1;
            color: rgba(255, 255, 255, 0.58);
            font-size: 12px;
        }

        main {
            display: flex;
            align-items: center;
            padding: 48px clamp(34px, 6vw, 66px);
        }

        .login-form-wrap {
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--brand);
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-size: 28px;
            line-height: 1.25;
            letter-spacing: -0.025em;
        }

        .intro {
            margin: 9px 0 28px;
            color: var(--muted);
            font-size: 14px;
        }

        .error {
            margin: 0 0 18px;
            padding: 11px 13px;
            border: 1px solid rgba(168, 63, 69, 0.25);
            border-radius: 10px;
            background: #fff5f5;
            color: var(--danger);
            font-size: 13px;
        }

        .field { margin-bottom: 17px; }

        label {
            display: block;
            margin: 0 0 7px;
            color: #39465a;
            font-size: 13px;
            font-weight: 650;
        }

        .input-wrap { position: relative; }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #fff;
            color: var(--ink);
            font-size: 15px;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input[type="password"] { padding-right: 74px; }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(23, 104, 178, 0.11);
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 7px;
            min-width: 58px;
            min-height: 34px;
            border: 0;
            border-radius: 8px;
            background: #f2f5f9;
            color: #536174;
            cursor: pointer;
            font-size: 12px;
            font-weight: 650;
            transform: translateY(-50%);
            transition: background-color 160ms ease, color 160ms ease;
        }

        .submit-button {
            width: 100%;
            min-height: 48px;
            margin-top: 6px;
            border: 0;
            border-radius: 11px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 720;
            box-shadow: 0 9px 20px rgba(23, 104, 178, 0.2);
            transition: transform 140ms var(--ease-out), background-color 160ms ease, opacity 160ms ease;
        }

        .submit-button:active { transform: scale(0.98); }
        .submit-button:disabled { cursor: wait; opacity: 0.7; }

        .security-note {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .security-note::before {
            content: "";
            width: 7px;
            height: 7px;
            flex: 0 0 7px;
            margin-top: 5px;
            border-radius: 50%;
            background: #21866f;
            box-shadow: 0 0 0 4px rgba(33, 134, 111, 0.1);
        }

        @media (hover: hover) and (pointer: fine) {
            .submit-button:hover { background: var(--brand-strong); }
            .password-toggle:hover { background: #e7edf5; color: var(--ink); }
        }

        @media (max-width: 720px) {
            body { padding: 16px; }

            .login-shell {
                min-height: 0;
                grid-template-columns: 1fr;
                border-radius: 20px;
            }

            .login-context {
                min-height: 126px;
                padding: 24px;
            }

            .context-copy,
            .context-footnote { display: none; }

            main { padding: 34px 24px 38px; }
        }

        @media (max-width: 380px) {
            body { padding: 0; background: var(--surface); }
            .login-shell { min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
            .login-context { min-height: 108px; padding: 22px; }
            main { align-items: flex-start; padding: 30px 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .submit-button { transform: none !important; }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <aside class="login-context" aria-label="产品介绍">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">BF</div>
                <div class="brand-name">BettaFish</div>
            </div>
            <div class="context-copy">
                <h2>让复杂舆情<br>变成清晰洞察</h2>
                <p>多智能体并行检索、分析与论证，在同一工作台持续跟踪研究进度并生成完整报告。</p>
            </div>
            <div class="context-footnote">智能舆情研究与报告平台</div>
        </aside>

        <main>
            <div class="login-form-wrap">
                <p class="eyebrow">Secure workspace</p>
                <h1>登录研究工作台</h1>
                <p class="intro">使用管理员提供的账号继续访问。</p>

                {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

                <form method="post" action="{{ url_for('login') }}" id="loginForm">
                    <input type="hidden" name="next" value="{{ next_url }}">

                    <div class="field">
                        <label for="username">用户名</label>
                        <input id="username" name="username" type="text" autocomplete="username" inputmode="text" required autofocus>
                    </div>

                    <div class="field">
                        <label for="password">密码</label>
                        <div class="input-wrap">
                            <input id="password" name="password" type="password" autocomplete="current-password" required>
                            <button class="password-toggle" id="passwordToggle" type="button" aria-controls="password" aria-pressed="false" aria-label="显示密码">显示</button>
                        </div>
                    </div>

                    <button class="submit-button" id="loginButton" type="submit">登录</button>
                </form>

                <p class="security-note">登录状态通过安全会话保存；请勿在公共设备上保留账号信息。</p>
            </div>
        </main>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');

        passwordToggle.addEventListener('click', () => {
            const reveal = passwordInput.type === 'password';
            passwordInput.type = reveal ? 'text' : 'password';
            passwordToggle.textContent = reveal ? '隐藏' : '显示';
            passwordToggle.setAttribute('aria-pressed', String(reveal));
            passwordToggle.setAttribute('aria-label', reveal ? '隐藏密码' : '显示密码');
            passwordInput.focus();
        });

        loginForm.addEventListener('submit', () => {
            loginButton.disabled = true;
            loginButton.textContent = '正在登录…';
        });
    </script>
</body>
</html>
