<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>流行文化小调查</title>
<style>
:root { --bg: #f6f7f9; --surface: #fff; --border: #e3e6eb; --text: #1c2330; --text-2: #5b6573; --accent: #2f6fdf; --accent-soft: #e8f0fd; --good: #1f8a5b; --bad: #c53b3b; }
@media (prefers-color-scheme: dark) { :root { --bg: #12151b; --surface: #1a1f27; --border: #2e3541; --text: #e6e9ee; --text-2: #aab2be; --accent: #6b9cf5; --accent-soft: #1f2d47; --good: #4cc38a; --bad: #ef6b6b; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin-bottom: 6px; }
.note { color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
.q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.q h3 { font-size: 16px; margin-bottom: 4px; word-break: break-word; }
.q .m { color: var(--text-2); font-size: 13px; margin-bottom: 10px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.opts button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.opts button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
label { font-size: 14px; color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.submit { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-size: 16px; margin-top: 8px; cursor: pointer; }
.submit:disabled { opacity: .5; }
.msg { text-align: center; margin-top: 14px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">流行文化小调查</h1>
  <div class="note">匿名作答，约 1 分钟。不收集姓名、学号等任何身份信息，结果只以汇总形式用于学校心理中心了解同学们关注的网络文化、设计更贴近大家的活动。</div>
  <div id="qs">加载中…</div>
  <button class="submit" id="submit" disabled>提交</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const base = location.pathname.replace(/\/+$/, "");
const answers = {};
async function load() {
  let d;
  try { d = await (await fetch(base + "/data", { credentials: "same-origin" })).json(); } catch (e) { d = { success: false }; }
  if (!d.success) { document.getElementById("qs").textContent = d.message || "投票不存在"; return; }
  document.getElementById("title").textContent = d.title;
  if (!d.open) { document.getElementById("qs").textContent = "本次调查已结束，谢谢关注！"; return; }
  document.getElementById("qs").innerHTML = d.items.map((it, i) => `<div class="q" data-key="${esc(it.key)}">
    <h3>${i + 1}. ${esc(it.label)}</h3>${it.meaning ? `<div class="m">${esc(it.meaning)}</div>` : ""}
    <div class="opts">${[["0", "没见过"], ["1", "见过"], ["2", "自己用过 / 做过"]].map(([v, n]) => `<button type="button" data-seen="${v}">${n}</button>`).join("")}</div>
    <label><input type="checkbox" data-follow> 最近有在关注 / 讨论这个</label></div>`).join("");
  document.querySelectorAll(".q").forEach((q) => {
    const key = q.dataset.key;
    q.querySelectorAll("[data-seen]").forEach((b) => b.addEventListener("click", () => {
      q.querySelectorAll("[data-seen]").forEach((x) => x.classList.toggle("on", x === b));
      answers[key] = { ...(answers[key] || {}), seen: +b.dataset.seen };
      document.getElementById("submit").disabled = false;
    }));
    q.querySelector("[data-follow]").addEventListener("change", (e) => { answers[key] = { seen: 0, ...(answers[key] || {}), follow: e.target.checked }; });
  });
}
document.getElementById("submit").addEventListener("click", async () => {
  const btn = document.getElementById("submit");
  btn.disabled = true;
  let r;
  try { r = await (await fetch(base + "/vote", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers }) })).json(); }
  catch (e) { r = { success: false, message: "网络错误，请重试" }; }
  document.getElementById("msg").textContent = r.message || (r.success ? "提交成功" : "提交失败");
  document.getElementById("msg").style.color = r.success ? "var(--good)" : "var(--bad)";
  if (!r.success && !/已经提交/.test(r.message || "")) btn.disabled = false;
});
load();
</script>
</body>
</html>
